name: Full Stack Deploy (Frontend + Backend)

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies (frontend)
        run: |
          cd frontend/vite-project
          npm install

      - name: Build React/Vite app
        run: |
          cd frontend/vite-project
          npm run build

      - name: Deploy frontend to S3
        run: |
          cd frontend/vite-project
          aws s3 sync build s3://${{ secrets.S3_BUCKET }} --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: deploy-frontend
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
  
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
  
      - name: Install dependencies (backend)
        run: |
          cd backend
          npm install
  
      - name: Zip backend for deployment
        run: |
          cd backend
          zip -r ../backend.zip .
  
      - name: Deploy backend to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.AWS_REGION }}
          application_name: ${{ secrets.EB_APP_NAME }}
          environment_name: ${{ secrets.EB_ENV_NAME }}
          version_label: backend-${{ github.sha }}
          deployment_package: backend.zip
          existing_bucket_name: ${{ secrets.S3_BUCKET_NAME }}-deployments
